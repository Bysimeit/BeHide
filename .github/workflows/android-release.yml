name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '.idea/**'
      - '.vscode/**'
      - '**/*.md'
      - '.github/workflows/relay-image.yml'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      official:
        description: 'Publier une release versionnée officielle (sinon build latest)'
        type: boolean
        default: false
      prerelease:
        description: 'Si officielle, marquer comme pré-release'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - id: version
        run: echo "value=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json

      - run: npx expo prebuild --platform android --no-install

      - env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - env:
          BEHIDE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BEHIDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BEHIDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BEHIDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BEHIDE_VERSION_CODE: ${{ github.run_number }}
        run: |
          node scripts/ci-android-release.mjs
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon

      - run: rm -f "$RUNNER_TEMP/release.jks" google-services.json
        if: always()

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          OFFICIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.official }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ "$OFFICIAL" = "true" ]; then
            cp "$APK" behide.apk
            sha256sum behide.apk > behide.apk.sha256
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            gh release create "v$VERSION" behide.apk behide.apk.sha256 \
              --title "BeHide $VERSION" --generate-notes $flags
          else
            cp "$APK" behide.apk
            sha256sum behide.apk > behide.apk.sha256
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest behide.apk behide.apk.sha256 \
              --title "Latest build ($VERSION, build $RUN_NUMBER)" \
              --notes "Signed APK built automatically from commit $COMMIT. Updated on every change to the app." \
              --prerelease
          fi
