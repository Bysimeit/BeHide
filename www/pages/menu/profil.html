<!DOCTYPE html>
<html ng-app="app">
    <head>
        <meta charset="utf-8">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <link rel="stylesheet" href="/www/css/index.css">
        <link rel="stylesheet" href="../css/conversations.css">
        <link rel="stylesheet" href="../css/appels.css">
        <link rel="stylesheet" href="../css/contacs.css">
        <title>BeHide</title>
    </head>
    <body ng-controller="Menu">
        <header class="header">
            <p class="copyright" ng-hide="panel==0">&copy;BeHide</p>
            <div class="off" ng-class="{off:panel==0, on:panel==1}">
                <div class="font-pp" ng-click="panel=0">
                    <!-- Photo de profil -->
                    <img class="pp" src="../img/default-profile.png"> <!-- Comme lien, mettre une image par défaut qui devra être dans l'hébergeur -->
                </div>
                <div class="bienvenue">
                    <!-- Mot gentil + prénom de l'utilisateur -->
                    <p class="message">Bonsoir Paul</p> <!-- Le prénom de la personne est à récupérer dans la bdd -->
                </div>
            </div>
            <div id="menu" class="font-menu begin" ng-class="{on:panel==1, off:panel==0}">
                <div class="font-pp" ng-click="panel=1">
                    <!-- Photo de profil -->
                    <img class="pp" src="../img/default-profile.png"> <!-- Comme lien, mettre une image par défaut qui devra être dans l'hébergeur -->
                </div>
                <div>
                    <input class="statut" type="text" placeholder="     Statut"> <!-- Le prénom de la personne est à récupérer dans la bdd -->
                    <a href="../pages/menu/profil.html">
                        <div class="menu-choix profil">
                            <strong>PROFIL</strong>
                        </div>
                    </a>
                    <a href="../pages/menu/support.html">
                        <div class="menu-choix support">
                            <strong>SUPPORT</strong>
                        </div>
                    </a>
                    <a href="../pages/menu/apropos.html">
                        <div class="menu-choix apropos">
                            <strong>À PROPOS</strong>
                        </div>
                    </a>
                </div>
            </div>
        </header>

        <nav ng-controller="NavCtrl">
            <a href="../pages/conversations.html" class="nav-rond-left"></a>
            <a href="#appels" class="nav-rond-center"></a>
            <a href="#contacts" class="nav-rond-right"></a>
        </nav>

        <script src="../js/jquery.js"></script>
        <script src="../js/angular.js"></script>
        <script src="../js/NavCtrl.js"></script>
        <script src="../js/app.js"></script>
        <script src="../js/Menu.js"></script>
    </body>
</html>
