<!DOCTYPE html>
<html ng-app="app">
    <head>
        <meta charset="utf-8">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <link rel="stylesheet" href="../Police/police.css">
        <link rel="stylesheet" href="css/index.css">
        <link rel="stylesheet" href="css/accueil.css">
        <title>BeHide</title>
    </head>
    <body>
        <header class="header">
            <p class="copyright">&copy;BeHide</p>
            <div class="off">
                <div class="font-pp">
                    <!-- Photo de profil -->
                    <img class="pp" src="../img/default-profile.png"> <!-- Comme lien, mettre une image par défaut qui devra être dans l'hébergeur -->
                </div>
                <div class="bienvenue">
                    <!-- Mot gentil + prénom de l'utilisateur -->
                    <p class="message">Bonsoir Paul</p> <!-- Le prénom de la personne est à récupérer dans la bdd -->
                </div>
            </div>
            <div class="on font-menu">
                <div class="font-pp">
                    <!-- Photo de profil -->
                    <img class="pp" src="../img/default-profile.png"> <!-- Comme lien, mettre une image par défaut qui devra être dans l'hébergeur -->
                </div>
                <div>
                    <input class="statut" type="text" placeholder="Statut"> <!-- Le prénom de la personne est à récupérer dans la bdd -->
                    <a href="#">
                        <div class="menu-choix profil">
                            <strong>PROFIL</strong>
                        </div>
                    </a>
                    <a href="#">
                        <div class="menu-choix support">
                            <strong>SUPPORT</strong>
                        </div>
                    </a>
                    <a href="#">
                        <div class="menu-choix apropos">
                            <strong>À PROPOS</strong>
                        </div>
                    </a>
                </div>
            </div>
        </header>
        
        <section class="view" ng-view></section>

        <nav ng-controller="NavCtrl">
            <a href="#conversations" ng-click="menu='conversations'" class="nav-rond-left" ng-class="{active: menu=='conversations'}"></a>
            <a href="#appels" ng-click="menu='appels'" class="nav-rond-center" ng-class="{active: menu=='appels'}"></a>
            <a href="#contacts" ng-click="menu='contacts'" class="nav-rond-right" ng-class="{active: menu=='contacts'}"></a>
        </nav>

        <script src="../js/jquery.js"></script>
        <script src="../js/angular.js"></script>
        <script src="../js/NavCtrl.js"></script>
        <script src="../js/app.js"></script>
    </body>
</html>
